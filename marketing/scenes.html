<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@600;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block}</style>
</head><body>
<script>
const P = new URLSearchParams(location.search);
const scene = P.get("s") || "title";
const W = +P.get("w") || 1920, H = +P.get("h") || 1080;

// ---------- helpers ----------
let defs = "", body = "";
const add = s => (body += s);
const lerp = (a, b, t) => a + (b - a) * t;

// Corridor rectangle at depth d (0 = screen edge, grows toward vanishing point)
function rectAt(vp, d) {
  const s = 1 / (1 + d);           // perspective scale
  return { x0: lerp(vp.x, 0, s), x1: lerp(vp.x, W, s), y0: lerp(vp.y, 0, s), y1: lerp(vp.y, H, s), s };
}

function baseDefs() {
  defs += `
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
    <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.55 0"/>
  </filter>
  <filter id="concrete">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="4" seed="9"/>
    <feColorMatrix values="0 0 0 0 0.22  0 0 0 0 0.22  0 0 0 0 0.24  0 0 0 0.9 0"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="textglow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
    <feFlood flood-color="#ff1a1a" flood-opacity="0.85"/><feComposite in2="b" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wallL" x1="0" x2="1"><stop offset="0" stop-color="#5a5a62"/><stop offset="1" stop-color="#1a1a1e"/></linearGradient>
  <linearGradient id="wallR" x1="1" x2="0"><stop offset="0" stop-color="#5a5a62"/><stop offset="1" stop-color="#1a1a1e"/></linearGradient>
  <linearGradient id="floorG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3a3636"/><stop offset="1" stop-color="#0d0c0c"/></linearGradient>
  <linearGradient id="ceilG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262428"/><stop offset="1" stop-color="#070708"/></linearGradient>`;
}

// Draws a maze corridor with a turn on one side, returns the vanishing point
function corridor(vp, opts = {}) {
  const far = rectAt(vp, opts.depth || 7);
  const poly = (pts, fill, extra = "") => add(`<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="${fill}" ${extra}/>`);
  poly([[0, 0], [W, 0], [far.x1, far.y0], [far.x0, far.y0]], "url(#ceilG)");
  poly([[0, H], [W, H], [far.x1, far.y1], [far.x0, far.y1]], "url(#floorG)");
  poly([[0, 0], [far.x0, far.y0], [far.x0, far.y1], [0, H]], "url(#wallL)");
  poly([[W, 0], [far.x1, far.y0], [far.x1, far.y1], [W, H]], "url(#wallR)");
  // concrete texture over walls
  poly([[0, 0], [far.x0, far.y0], [far.x0, far.y1], [0, H]], "#fff", `filter="url(#concrete)" opacity=".7"`);
  poly([[W, 0], [far.x1, far.y0], [far.x1, far.y1], [W, H]], "#fff", `filter="url(#concrete)" opacity=".7"`);
  // wall segment seams, like the maze's 16-stud cells
  for (const d of [0.6, 1.5, 2.7, 4.2]) {
    const r = rectAt(vp, d);
    add(`<line x1="${r.x0}" y1="${r.y0}" x2="${r.x0}" y2="${r.y1}" stroke="#0c0c0e" stroke-width="${6 * r.s + 1}" opacity=".8"/>`);
    add(`<line x1="${r.x1}" y1="${r.y0}" x2="${r.x1}" y2="${r.y1}" stroke="#0c0c0e" stroke-width="${6 * r.s + 1}" opacity=".8"/>`);
    add(`<line x1="${r.x0}" y1="${r.y1}" x2="${r.x1}" y2="${r.y1}" stroke="#000" stroke-width="${3 * r.s + 1}" opacity=".5"/>`);
  }
  // side openings (dark turns)
  for (const [side, d1, d2] of opts.openings || []) {
    const a = rectAt(vp, d1), b = rectAt(vp, d2);
    const xa = side === "L" ? a.x0 : a.x1, xb = side === "L" ? b.x0 : b.x1;
    poly([[xa, a.y0], [xb, b.y0], [xb, b.y1], [xa, a.y1]], "#050506");
  }
  // far wall
  poly([[far.x0, far.y0], [far.x1, far.y0], [far.x1, far.y1], [far.x0, far.y1]], opts.farColor || "#000");
  return far;
}

// Ceiling lamp glow at depth d
function lamp(vp, d, color = "#ff9a55", strength = 1) {
  const r = rectAt(vp, d), cx = vp.x + (P.get("lampx") ? 0 : 0), y = r.y0 + 8 * r.s;
  add(`<ellipse cx="${cx}" cy="${y + 120 * r.s}" rx="${420 * r.s}" ry="${300 * r.s}" fill="${color}" opacity="${0.22 * strength}" filter="url(#bigglow)"/>`);
  add(`<rect x="${cx - 40 * r.s}" y="${y}" width="${80 * r.s}" height="${14 * r.s}" fill="#ffd2a0" filter="url(#glow)"/>`);
}

// The monster: tall black figure, tilted head, long arms, red eyes. Feet at (x, footY), height h.
function monster(x, footY, h, opts = {}) {
  const u = h / 12; // 12 units tall
  const g = `translate(${x},${footY}) scale(${u})`;
  const blk = "#030303";
  let s = `<g transform="${g}">`;
  // backlight halo
  if (opts.halo) s += `<ellipse cx="0" cy="-6" rx="5" ry="7" fill="${opts.halo}" opacity=".35" filter="url(#bigglow)"/>`;
  s += `<path d="M-0.9 0 L-0.5 -5 L0.5 -5 L0.9 0 L0.45 0 L0 -4.2 L-0.45 0 Z" fill="${blk}"/>`; // legs
  s += `<path d="M-1.6 -5 Q-1.7 -8.5 -1.2 -9.6 L1.2 -9.6 Q1.7 -8.5 1.6 -5 Z" fill="${blk}"/>`; // torso
  s += `<path d="M-1.3 -9.4 Q-2.4 -7 -2.5 -3.4 L-2.1 -3.3 Q-1.8 -6.5 -1.0 -8.6 Z" fill="${blk}"/>`; // left arm
  s += `<path d="M1.3 -9.4 Q2.4 -7 2.5 -3.4 L2.1 -3.3 Q1.8 -6.5 1.0 -8.6 Z" fill="${blk}"/>`; // right arm
  s += `<path d="M-2.5 -3.4 l-0.25 0.9 M-2.4 -3.4 l0 1 M-2.25 -3.4 l0.2 0.9 M2.5 -3.4 l0.25 0.9 M2.4 -3.4 l0 1 M2.25 -3.4 l-0.2 0.9" stroke="${blk}" stroke-width="0.12" stroke-linecap="round"/>`; // fingers
  s += `<g transform="translate(0,-10.6) rotate(12)">`;
  s += `<rect x="-1" y="-1.3" width="2" height="2.6" rx="0.7" fill="${blk}"/>`; // head
  s += `<g filter="url(#glow)">`;
  s += `<rect x="-0.68" y="-0.35" width="0.38" height="0.2" fill="#ff1010"/>`;
  s += `<rect x="0.3" y="-0.5" width="0.38" height="0.2" fill="#ff1010"/>`;
  s += `<rect x="-0.5" y="0.55" width="1.0" height="0.08" fill="#a00000"/>`;
  s += `</g></g></g>`;
  add(s);
}

// Glowing yellow key orb (the game's keys are neon balls)
function key(x, y, r) {
  add(`<circle cx="${x}" cy="${y}" r="${r * 6}" fill="#ffc828" opacity=".25" filter="url(#bigglow)"/>`);
  add(`<circle cx="${x}" cy="${y}" r="${r}" fill="#ffd84a" filter="url(#glow)"/>`);
  add(`<circle cx="${x - r * .3}" cy="${y - r * .3}" r="${r * .35}" fill="#fff6c8"/>`);
}

// Flashlight: darkness everywhere except a soft warm pool
function flashlight(cx, cy, r, dark = 0.93) {
  defs += `<radialGradient id="torch" cx="${cx / W}" cy="${cy / H}" r="${r / Math.max(W, H)}" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="${dark}"/></radialGradient>
    <radialGradient id="warm" cx="${cx / W}" cy="${cy / H}" r="${r / Math.max(W, H) * .7}" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#fff1d6" stop-opacity=".22"/><stop offset="1" stop-color="#fff1d6" stop-opacity="0"/></radialGradient>`;
  add(`<rect width="${W}" height="${H}" fill="url(#warm)"/>`);
  add(`<rect width="${W}" height="${H}" fill="url(#torch)"/>`);
}

function vignette(strength = .85) {
  defs += `<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${strength}"/></radialGradient>`;
  add(`<rect width="${W}" height="${H}" fill="url(#vig)"/>`);
}
function redTint(o = .18) { add(`<rect width="${W}" height="${H}" fill="#7a0000" opacity="${o}" style="mix-blend-mode:multiply"/>`); }
function grain(o = .35) { add(`<rect width="${W}" height="${H}" filter="url(#grain)" opacity="${o}" style="mix-blend-mode:overlay"/>`); }

function title(x, y, size, anchor = "middle", text = "THE HOLLOW") {
  add(`<text x="${x}" y="${y}" font-family="Creepster" font-size="${size}" fill="#d81818" text-anchor="${anchor}" filter="url(#textglow)" letter-spacing="${size * .03}">${text}</text>`);
  add(`<text x="${x}" y="${y}" font-family="Creepster" font-size="${size}" fill="none" stroke="#2a0000" stroke-width="${size * .015}" text-anchor="${anchor}" letter-spacing="${size * .03}">${text}</text>`);
}
function tag(x, y, size, text, color = "#f2ede4", anchor = "middle", spacing = .18) {
  add(`<text x="${x}" y="${y}" font-family="Oswald" font-weight="700" font-size="${size}" fill="${color}" text-anchor="${anchor}" letter-spacing="${size * spacing}" style="paint-order:stroke" stroke="#000" stroke-width="${size * .12}">${text}</text>`);
}

// ---------- scenes ----------
baseDefs();
const vp = { x: W / 2, y: H * 0.47 };

if (scene === "title") {
  // Monster at the end of the corridor, backlit by a flickering lamp
  corridor(vp, { openings: [["L", 1.6, 2.4], ["R", 3.1, 3.8]] });
  lamp(vp, 3.3, "#ff7a3a", 1.2);
  const r = rectAt(vp, 3.7);
  monster(vp.x + 30, r.y1, (r.y1 - r.y0) * .95, { halo: "#ff3a1a" });
  flashlight(W / 2, H * .5, 900, .9);
  vignette(.9); redTint(.12); grain();
  title(W / 2, H * .2, 230);
  tag(W / 2, H * .9, 54, "FIND 5 KEYS · REACH THE GATE · DON'T LET IT SEE YOU", "#e8e2d6", "middle", .12);
}

if (scene === "keys") {
  const v = { x: W * .58, y: H * .47 };
  corridor(v, { openings: [["R", 1.2, 2.0], ["L", 2.6, 3.4]] });
  lamp(v, 2.2, "#ff9a55", .8);
  const k = rectAt(v, 1.1);
  key(v.x - 120, k.y1 - 120 * k.s * 4, 26);
  const m = rectAt(v, 5.2);
  monster(v.x + 40, m.y1, (m.y1 - m.y0) * .95);
  flashlight(v.x - 100, H * .62, 760, .95);
  vignette(.9); grain();
  // HUD like the in-game status line
  add(`<text x="${W / 2}" y="110" font-family="Creepster" font-size="96" fill="#e6e6e6" text-anchor="middle" style="paint-order:stroke" stroke="#000" stroke-width="10">Keys 4/5   0:41</text>`);
  tag(110, H - 210, 150, "FIND THE KEYS", "#ffd84a", "start", .06);
  tag(116, H - 110, 62, "BEFORE IT FINDS YOU.", "#f2ede4", "start", .1);
}

if (scene === "behind") {
  // Close-up: it's right behind the camera's shoulder
  const v = { x: W * .3, y: H * .5 };
  corridor(v, { openings: [["L", 1.0, 1.8]] });
  lamp(v, 2.6, "#ff9a55", .6);
  flashlight(v.x, H * .58, 650, .97);
  monster(W * .73, H * 1.82, H * 1.75, { halo: "#ff1a1a" });
  vignette(.8); redTint(.22); grain(.4);
  tag(110, H * .2, 140, "DON'T", "#f2ede4", "start", .06);
  tag(110, H * .2 + 150, 140, "LOOK BACK.", "#e01e1e", "start", .06);
}

if (scene === "jumpscare") {
  // The game's jumpscare face, shaking over red flashes
  add(`<rect width="${W}" height="${H}" fill="#4a0000"/>`);
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 26; i++) {
    const y = rnd() * H, hgt = 4 + rnd() * 30;
    add(`<rect x="0" y="${y}" width="${W}" height="${hgt}" fill="${rnd() < .5 ? "#000" : "#b00000"}" opacity="${.2 + rnd() * .4}"/>`);
  }
  defs += `<radialGradient id="skin" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#e2ddd2"/><stop offset=".7" stop-color="#a9a399"/><stop offset="1" stop-color="#4d4842"/></radialGradient>
    <radialGradient id="socket" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#000"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>`;
  const face = (dx, op) => {
    const cx = W * .63 + dx, cy = H * .55, fw = H * .66, fh = H * 1.2;
    let s = `<g opacity="${op}" transform="rotate(-6 ${cx} ${cy})">`;
    s += `<rect x="${cx - fw / 2}" y="${cy - fh / 2}" width="${fw}" height="${fh}" rx="${fw * .45}" fill="url(#skin)"/>`;
    // sunken sockets
    s += `<ellipse cx="${cx - fw * .21}" cy="${cy - fh * .15}" rx="${fw * .2}" ry="${fh * .13}" fill="url(#socket)" opacity=".6"/>`;
    s += `<ellipse cx="${cx + fw * .21}" cy="${cy - fh * .17}" rx="${fw * .2}" ry="${fh * .14}" fill="url(#socket)" opacity=".6"/>`;
    s += `<ellipse cx="${cx - fw * .2}" cy="${cy - fh * .15}" rx="${fw * .13}" ry="${fh * .095}" fill="#000"/>`;
    s += `<ellipse cx="${cx + fw * .2}" cy="${cy - fh * .17}" rx="${fw * .13}" ry="${fh * .105}" fill="#000"/>`;
    s += `<circle cx="${cx - fw * .2}" cy="${cy - fh * .14}" r="${fw * .025}" fill="#ff1010" filter="url(#glow)"/>`;
    s += `<circle cx="${cx + fw * .2}" cy="${cy - fh * .16}" r="${fw * .025}" fill="#ff1010" filter="url(#glow)"/>`;
    // gaping mouth with jagged teeth
    const mx = cx, my = cy + fh * .23, mw = fw * .52, mh = fh * .36;
    s += `<rect x="${mx - mw / 2}" y="${my - mh / 2}" width="${mw}" height="${mh}" rx="${mw * .48}" fill="#000"/>`;
    const top = my - mh / 2 + mh * .06, bot = my + mh / 2 - mh * .06;
    for (let i = 0; i < 6; i++) {
      const x0 = mx - mw * .36 + i * mw * .12, len = mh * (.22 + (i % 2) * .1);
      s += `<path d="M${x0} ${top} L${x0 + mw * .12} ${top} L${x0 + mw * .06 + (i % 2 ? 6 : -6)} ${top + len} Z" fill="#e6e1c8"/>`;
      s += `<path d="M${x0 + mw * .03} ${bot} L${x0 + mw * .13} ${bot} L${x0 + mw * .08} ${bot - len * .7} Z" fill="#d8d2b4"/>`;
    }
    return s + `</g>`;
  };
  add(face(-46, .25)); add(face(38, .25)); add(face(0, 1));
  vignette(.95); grain(.5);
  tag(100, H * .42, 150, "IT WILL", "#f2ede4", "start", .05);
  tag(100, H * .42 + 165, 150, "FIND YOU.", "#ff2a2a", "start", .05);
}

if (scene === "gate") {
  // Gate open and glowing green, monster right behind the player
  const v = { x: W / 2, y: H * .47 };
  const far = corridor(v, { depth: 5, farColor: "#041a0c", openings: [["L", 1.4, 2.1]] });
  add(`<rect x="${far.x0}" y="${far.y0}" width="${far.x1 - far.x0}" height="${far.y1 - far.y0}" fill="#00ff78" opacity=".55" filter="url(#glow)"/>`);
  add(`<ellipse cx="${v.x}" cy="${v.y}" rx="${(far.x1 - far.x0) * 2.4}" ry="${(far.y1 - far.y0) * 1.6}" fill="#00ff78" opacity=".28" filter="url(#bigglow)"/>`);
  flashlight(v.x, v.y, 820, .9);
  // the monster's hand reaching in from the left edge
  add(`<g transform="translate(-60 ${H * .62}) rotate(-14)" fill="#020202">
       <path d="M0 -40 Q300 -70 520 -26 Q560 -18 560 10 Q560 40 520 44 Q300 70 0 90 Z"/>
       <path d="M540 -20 Q640 -90 760 -120 Q690 -70 600 -4 Z"/>
       <path d="M552 -2 Q680 -30 800 -30 Q700 0 600 18 Z"/>
       <path d="M552 16 Q670 20 780 60 Q680 50 596 36 Z"/>
       <path d="M540 32 Q620 70 690 130 Q610 100 560 50 Z"/>
       <path d="M500 40 Q470 90 430 120 Q470 70 470 40 Z"/></g>`);
  vignette(.85); grain();
  tag(W / 2, H * .2, 170, "RUN.", "#00ff8a", "middle", .2);
  tag(W / 2, H * .9, 56, "THE GATE IS OPEN — IF YOU CAN REACH IT", "#f2ede4", "middle", .1);
}

if (scene === "icon") {
  // Square icon: face peering out of the dark, big red eyes, wordmark
  add(`<rect width="${W}" height="${H}" fill="#050505"/>`);
  defs += `<radialGradient id="ib" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#3a0606"/><stop offset=".6" stop-color="#120202"/><stop offset="1" stop-color="#000"/></radialGradient>`;
  add(`<rect width="${W}" height="${H}" fill="url(#ib)"/>`);
  monster(W * .5, H * 2.5, W * 2.4, { halo: "#ff1a1a" });
  vignette(.7); grain(.3);
  add(`<rect x="0" y="${H * .74}" width="${W}" height="${H * .26}" fill="url(#fadeB)"/>`);
  defs += `<linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity=".85"/></linearGradient>`;
  title(W / 2, H * .93, W * .2);
}

// ---------- shop item icons (512x512, kept inside a circle: Roblox crops passes round) ----------
function itemBg(inner, outer) {
  defs += `<radialGradient id="ibg" cx=".5" cy=".45" r=".65"><stop offset="0" stop-color="${inner}"/><stop offset=".75" stop-color="${outer}"/><stop offset="1" stop-color="#000"/></radialGradient>`;
  add(`<rect width="${W}" height="${H}" fill="url(#ibg)"/>`);
}
const C = W / 2;

if (scene === "flashlight") {
  itemBg("#3b2a6e", "#0d0820");
  defs += `<linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff6dc" stop-opacity=".95"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8a96"/><stop offset=".45" stop-color="#3a3a44"/><stop offset="1" stop-color="#15151a"/></linearGradient>`;
  add(`<g transform="rotate(-40 ${C} ${C})">
    <polygon points="${C + 40},${C - 38} ${C + 260},${C - 170} ${C + 260},${C + 170} ${C + 40},${C + 38}" fill="url(#beam)" filter="url(#blur3)"/>
    <rect x="${C - 190}" y="${C - 30}" width="190" height="60" rx="14" fill="url(#metal)"/>
    <rect x="${C - 150}" y="${C - 30}" width="14" height="60" fill="#1c1c22"/><rect x="${C - 120}" y="${C - 30}" width="14" height="60" fill="#1c1c22"/>
    <path d="M${C} ${C - 30} L${C + 46} ${C - 50} L${C + 46} ${C + 50} L${C} ${C + 30} Z" fill="url(#metal)"/>
    <ellipse cx="${C + 46}" cy="${C}" rx="12" ry="50" fill="#fffbe8" filter="url(#glow)"/>
    <rect x="${C - 80}" y="${C - 40}" width="34" height="14" rx="4" fill="#b98cff"/></g>`);
  for (const [x, y, r] of [[C + 120, C - 150, 16], [C + 170, C - 60, 10], [C + 40, C - 190, 9]]) {
    add(`<path d="M${x} ${y - r * 2} L${x + r * .5} ${y - r * .5} L${x + r * 2} ${y} L${x + r * .5} ${y + r * .5} L${x} ${y + r * 2} L${x - r * .5} ${y + r * .5} L${x - r * 2} ${y} L${x - r * .5} ${y - r * .5} Z" fill="#fff" filter="url(#glow)"/>`);
  }
}

if (scene === "stamina") {
  itemBg("#4a2a7a", "#100820");
  add(`<path d="M${C} ${C} C ${C - 60} ${C - 110}, ${C - 200} ${C - 110}, ${C - 200} ${C} C ${C - 200} ${C + 110}, ${C - 60} ${C + 110}, ${C} ${C} C ${C + 60} ${C - 110}, ${C + 200} ${C - 110}, ${C + 200} ${C} C ${C + 200} ${C + 110}, ${C + 60} ${C + 110}, ${C} ${C} Z"
    fill="none" stroke="#b98cff" stroke-width="34" stroke-linejoin="round" filter="url(#glow)"/>`);
  add(`<path d="M${C + 30} ${C - 170} L${C - 70} ${C + 15} L${C - 5} ${C + 15} L${C - 35} ${C + 170} L${C + 75} ${C - 30} L${C + 10} ${C - 30} Z"
    fill="#ffd84a" stroke="#3a2200" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>`);
}

if (scene === "revive") {
  itemBg("#0f5a2e", "#03140a");
  const heart = `M${C} ${C + 150} C ${C - 40} ${C + 110}, ${C - 190} ${C + 20}, ${C - 190} ${C - 60} C ${C - 190} ${C - 150}, ${C - 80} ${C - 175}, ${C} ${C - 95} C ${C + 80} ${C - 175}, ${C + 190} ${C - 150}, ${C + 190} ${C - 60} C ${C + 190} ${C + 20}, ${C + 40} ${C + 110}, ${C} ${C + 150} Z`;
  defs += `<linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dffb0"/><stop offset="1" stop-color="#14a050"/></linearGradient>`;
  add(`<path d="${heart}" fill="#00ff78" opacity=".35" filter="url(#bigglow)"/>`);
  add(`<path d="${heart}" fill="url(#hg)" stroke="#063a1c" stroke-width="10"/>`);
  add(`<polyline points="${C - 150},${C - 20} ${C - 70},${C - 20} ${C - 40},${C - 80} ${C},${C + 50} ${C + 35},${C - 40} ${C + 60},${C - 20} ${C + 150},${C - 20}"
    fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>`);
}

if (scene === "freeze") {
  itemBg("#0f3a6a", "#020a18");
  monster(C - 10, C + 160, 330, { halo: "#ff1a1a" });
  // ice block over the monster
  add(`<g opacity=".85">
    <polygon points="${C - 170},${C - 150} ${C + 150},${C - 180} ${C + 190},${C + 140} ${C - 150},${C + 180}" fill="#9fdcff" opacity=".45"/>
    <polygon points="${C - 170},${C - 150} ${C - 60},${C - 165} ${C - 110},${C + 170} ${C - 150},${C + 180}" fill="#d8f2ff" opacity=".35"/>
    <polyline points="${C - 170},${C - 150} ${C + 150},${C - 180} ${C + 190},${C + 140} ${C - 150},${C + 180} ${C - 170},${C - 150}" fill="none" stroke="#e8f8ff" stroke-width="8" stroke-linejoin="round"/>
    <path d="M${C - 120} ${C - 120} L${C - 60} ${C - 128} M${C + 100} ${C + 60} L${C + 140} ${C + 120} M${C + 40} ${C + 120} L${C + 80} ${C + 70}" stroke="#fff" stroke-width="5" opacity=".8"/></g>`);
  // snowflake badge
  const sx = C + 115, sy = C - 115;
  add(`<circle cx="${sx}" cy="${sy}" r="62" fill="#0b2a52" stroke="#bfe9ff" stroke-width="6"/>`);
  for (let a = 0; a < 6; a++) {
    add(`<g transform="rotate(${a * 60} ${sx} ${sy})" stroke="#e8f8ff" stroke-width="7" stroke-linecap="round">
      <line x1="${sx}" y1="${sy}" x2="${sx}" y2="${sy - 44}"/><line x1="${sx}" y1="${sy - 26}" x2="${sx - 12}" y2="${sy - 38}"/><line x1="${sx}" y1="${sy - 26}" x2="${sx + 12}" y2="${sy - 38}"/></g>`);
  }
}

document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>${body}</svg>`;
</script>
</body></html>
